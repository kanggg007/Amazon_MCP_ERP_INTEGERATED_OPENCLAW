# ETL Schedule Configuration
# SP-API call frequency per store

ETL_SCHEDULE:
  orders:
    frequency: hourly        # Pull new orders every hour
    description: Catch new orders quickly for processing
    sp_api_endpoint: /orders/v0/orders
    calls_per_day: 24

  inventory:
    frequency: daily         # Once per day
    description: Inventory snapshot - stock levels
    sp_api_endpoint: /fba/inventory/v1/summaries
    calls_per_day: 1

  fba_shipments:
    frequency: daily         # Once per day
    description: Inbound shipment tracking
    sp_api_endpoint: /fba/inbound/v0/shipments
    calls_per_day: 1

  ads_performance:
    frequency: daily         # Once per day
    description: Advertising performance data
    calls_per_day: 1

  settlements:
    frequency: weekly        # Search for new settlement reports
    description: Auto-generated by Amazon - search and ingest
    ingestion_cmd: python -m data.ingestion --store={STORE} --mode=settlements
    calls_per_day: 0  # On-demand, not scheduled

  reconciliation:
    frequency: daily         # Reconcile refunds -> loss events
    description: Match refunds to returns, generate customer_loss_events
    ingestion_cmd: python -m data.ingestion --store={STORE} --mode=reconcile
    calls_per_day: 1

  profit_leakage:
    frequency: daily         # Refresh daily financials
    description: Calculate true profit and detect leakage
    ingestion_cmd: python -m data.ingestion --store={STORE} --mode=leakage
    calls_per_day: 1

TOTAL_CALLS_PER_STORE_PER_DAY: 29
TOTAL_CALLS_5_STORES: 145
